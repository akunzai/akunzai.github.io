name: Deploy Astro to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up aube (+ node)
        uses: jdx/aube-action@v1
        with:
          node-version: auto

      - id: aube-paths
        run: |
          echo "store=$(aube store path)" >> "$GITHUB_OUTPUT"
          echo "cache=$(aube cache path)" >> "$GITHUB_OUTPUT"

      - name: Cache aube store
        uses: actions/cache@v6
        with:
          path: ${{ steps.aube-paths.outputs.store }}
          key: ${{ runner.os }}-aube-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Cache aube registry metadata
        uses: actions/cache@v6
        with:
          path: ${{ steps.aube-paths.outputs.cache }}
          key: ${{ runner.os }}-aube-cache-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: aube ci

      - name: Build with Astro
        run: aubr build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
