name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up aube (+ node)
        uses: jdx/aube-action@v1
        with:
          node-version: auto

      - id: aube-paths
        run: |
          echo "store=$(aube store path)" >> "$GITHUB_OUTPUT"
          echo "cache=$(aube cache path)" >> "$GITHUB_OUTPUT"

      - name: Cache aube store
        uses: actions/cache@v6
        with:
          path: ${{ steps.aube-paths.outputs.store }}
          key: ${{ runner.os }}-aube-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Cache aube registry metadata
        uses: actions/cache@v6
        with:
          path: ${{ steps.aube-paths.outputs.cache }}
          key: ${{ runner.os }}-aube-cache-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: aube ci

      - name: Type & syntax check
        run: aubr check

      - name: Check zh-tw terminology (zhtw-mcp)
        run: |
          base=https://github.com/sysprog21/zhtw-mcp/releases/download/latest
          asset=zhtw-mcp-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSLO "$base/$asset" -O "$base/SHA256SUMS"
          sha256sum --ignore-missing -c SHA256SUMS
          tar -xzf "$asset" zhtw-mcp
          chmod +x zhtw-mcp
          ./zhtw-mcp lint src/content/docs/zh-tw/ --content-type markdown \
            --baseline .zhtw-mcp/baseline.json --max-errors 0 --max-warnings 0

      - name: Build static site
        run: aubr build
