version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      npm:
        patterns:
          - "*"

  # Workflows pin major tags (e.g. actions/checkout@v7, jdx/mise-action@v4).
  # Ignore minor/patch so Dependabot only opens PRs for major bumps — not
  # noise like #11 (jdx/mise-action@v4 → @4.2.3).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
