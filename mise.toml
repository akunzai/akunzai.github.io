[tools]
node = "lts"
aube = "latest"

[tasks.verify]
description = "Type-check and build the site (matches CI's Check & Build job)"
run = ["aube run check", "aube run build"]

# zhtw-mcp fingerprints findings by absolute path. The helper mounts the repo
# at CI's checkout path so local findings match the baseline.
[tasks."zhtw:build"]
description = "Build the local zhtw-mcp image"
run = "node scripts/zhtw-container.mjs build"

[tasks."zhtw:lint"]
description = "Lint zh-tw content for Mainland terminology (matches CI)"
run = "node scripts/zhtw-container.mjs lint"

[tasks."zhtw:baseline"]
description = "Regenerate .zhtw-mcp/baseline.json after accepting new findings"
run = "node scripts/zhtw-container.mjs baseline"
